name: Pashto Ghag lecturer sample
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pashto-ghag.yml'
permissions:
  contents: read
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 espeak-ng
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install 'TTS==0.22.0' 'transformers<4.50' 'huggingface_hub<1' 'numpy<2'
      - name: Download public model
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Nasimbahar/pashto-ghag-yourtts', local_dir='model', allow_patterns=['*.pth','*.json','*.py','*.md'])"
      - name: Register missing Pashto grapheme cleaner
        run: |
          cat > ghag_infer.py <<'PY'
          import re
          import runpy
          import sys
          import unicodedata
          from pathlib import Path
          from TTS.tts.utils.text import cleaners

          def pashto_grapheme_cleaners(text):
              text = unicodedata.normalize("NFC", text)
              return re.sub(r"\s+", " ", text).strip()

          # Preserve an upstream implementation if a future TTS version includes it.
          if not hasattr(cleaners, "pashto_grapheme_cleaners"):
              cleaners.pashto_grapheme_cleaners = pashto_grapheme_cleaners
          assert callable(cleaners.pashto_grapheme_cleaners)
          assert "پښتو" in cleaners.pashto_grapheme_cleaners("  پښتو  ")
          from TTS.api import TTS
          import json
          import inspect
          import torch
          import numbers

          original_init = TTS.__init__
          def patched_init(self, *args, **kwargs):
              bound = inspect.signature(original_init).bind(self, *args, **kwargs)
              root = Path("model").resolve()
              config = json.loads(Path(bound.arguments["config_path"]).read_text(encoding="utf-8"))
              # The release contains an ID map, not necessarily a d-vector map.
              speaker_path = root / "speakers.pth"
              speakers = torch.load(speaker_path, map_location="cpu", weights_only=True)
              assert isinstance(speakers, dict) and speakers, "Empty or invalid speaker map"
              id_map = all(isinstance(v, numbers.Integral) for v in speakers.values())
              vector_map = all(isinstance(v, dict) and "name" in v and "embedding" in v for v in speakers.values())
              print("Speaker map type:", "IDs" if id_map else "vectors" if vector_map else "unknown", flush=True)
              # Inspect checkpoint architecture on CPU before selecting conditioning.
              checkpoint = torch.load(root / "best_model.pth", map_location="cpu", weights_only=True)
              state = checkpoint.get("model", checkpoint)
              learned = [(k, v) for k, v in state.items() if k.endswith("emb_g.weight") and isinstance(v, torch.Tensor)]
              print("Learned speaker embedding shapes:", [(k, tuple(v.shape)) for k,v in learned], flush=True)
              model_args = config.setdefault("model_args", {})
              def set_both(key, value):
                  config[key] = value
                  model_args[key] = value
              set_both("speaker_encoder_model_path", str(root / "model_se.pth"))
              set_both("speaker_encoder_config_path", str(root / "config_se.json"))
              if id_map and learned:
                  rows, channels = learned[0][1].shape
                  assert min(speakers.values()) >= 0 and max(speakers.values()) < rows
                  set_both("use_speaker_embedding", True)
                  set_both("use_d_vector_file", False)
                  set_both("d_vector_file", None)
                  set_both("speakers_file", str(speaker_path))
                  set_both("num_speakers", rows)
                  set_both("speaker_embedding_channels", channels)
              else:
                  # Find genuine external vectors, including any embedded in the checkpoint.
                  candidates = []
                  if vector_map:
                      candidates.append(speakers)
                  for key in ("d_vectors", "speaker_embeddings", "speaker_manager", "speakers"):
                      value = checkpoint.get(key)
                      if isinstance(value, dict) and value and all(isinstance(v, dict) and "name" in v and "embedding" in v for v in value.values()):
                          candidates.append(value)
                  if not candidates:
                      raise RuntimeError("The published speaker file contains IDs but the checkpoint has no learned speaker table or usable d-vectors. Obtain the original d-vector file from the model author; cannot synthesize the selected speaker from IDs alone.")
                  vectors = root / "_mss_d_vectors.pth"
                  torch.save(candidates[0], vectors)
                  set_both("use_speaker_embedding", False)
                  set_both("use_d_vector_file", True)
                  set_both("d_vector_file", [str(vectors)])
                  set_both("speakers_file", str(speaker_path))
              del checkpoint, state, learned
              config["output_path"] = str(root)
              config["datasets"] = []
              runtime = root / "_mss_runtime_config.json"
              runtime.write_text(json.dumps(config, ensure_ascii=False), encoding="utf-8")
              bound.arguments["config_path"] = str(runtime)
              return original_init(*bound.args, **bound.kwargs)
          TTS.__init__ = patched_init

          helper = Path("model/hf_infer_pashto_ghag_yourtts.py").resolve()
          sys.path.insert(0, str(helper.parent))
          sys.argv[0] = str(helper)
          runpy.run_path(str(helper), run_name="__main__")
          PY
      - name: Generate Pashto lecturer example
        shell: bash
        run: |
          mkdir -p out
          sentences=(
            'السلام علیکم ګرانو زده کوونکو! زموږ د فلاتر د زده کړې لړۍ ته ښه راغلاست.'
            'نن به په عملي ډول زده کړو چې فلاتر څه شی دی او څنګه کولای شو د موبایل لپاره یوه ساده اپلېکېشن جوړه کړو.'
            'فلاتر موږ ته دا اسانتیا راکوي چې د یوه کوډ په وسیله د بېلابېلو وسیلو لپاره اپلېکېشن جوړ کړو.'
            'لومړی به یوه نوې پروژه جوړه کړو. بیا به د هغې جوړښت او د کوډ هره برخه په ګډه وڅېړو.'
            'که تاسې له پروګرامینګ سره تازه بلد شوي یاست، اندېښنه مه کوئ. هر مثال به په ساده ژبه او ګام په ګام تشریح کړو.'
          )
          for i in "${!sentences[@]}"; do
            python ghag_infer.py --model-dir "$PWD/model" --text "${sentences[$i]}" --speaker-id speaker_01_nasim_bahar --output-wav "out/part-$i.wav"
            ffmpeg -v error -y -i "out/part-$i.wav" -ar 22050 -ac 1 -c:a pcm_s16le "out/segment-$i.wav"
            printf "file 'segment-%s.wav'\n" "$i" >> out/concat.txt
          done
          ffmpeg -v error -y -f concat -safe 0 -i out/concat.txt -af 'highpass=f=70,loudnorm=I=-16:TP=-1.5:LRA=11' -ar 48000 -c:a libmp3lame -b:a 192k out/pashto-lecturer.mp3
          ffprobe -v error -show_format -show_streams out/pashto-lecturer.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: pashto-ghag-lecturer
          path: out/pashto-lecturer.mp3
          if-no-files-found: error
          retention-days: 7
