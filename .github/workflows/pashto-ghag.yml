name: Pashto Ghag lecturer sample
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pashto-ghag.yml'
permissions:
  contents: read
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 espeak-ng
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install 'TTS==0.22.0' 'transformers<4.50' 'huggingface_hub<1' 'numpy<2'
      - name: Download public model
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Nasimbahar/pashto-ghag-yourtts', local_dir='model', allow_patterns=['*.pth','*.json','*.py','*.md'])"
      - name: Register missing Pashto grapheme cleaner
        run: |
          cat > ghag_infer.py <<'PY'
          import re
          import runpy
          import sys
          import unicodedata
          from pathlib import Path
          from TTS.tts.utils.text import cleaners

          def pashto_grapheme_cleaners(text):
              text = unicodedata.normalize("NFC", text)
              return re.sub(r"\s+", " ", text).strip()

          # Preserve an upstream implementation if a future TTS version includes it.
          if not hasattr(cleaners, "pashto_grapheme_cleaners"):
              cleaners.pashto_grapheme_cleaners = pashto_grapheme_cleaners
          assert callable(cleaners.pashto_grapheme_cleaners)
          assert "پښتو" in cleaners.pashto_grapheme_cleaners("  پښتو  ")
          from TTS.tts.utils import managers
          from TTS.api import TTS
          import json
          import inspect

          # The published config may retain training-machine paths.
          # Repair the final config actually passed to Coqui, including nested args.
          original_init = TTS.__init__
          def patched_init(self, *args, **kwargs):
              bound = inspect.signature(original_init).bind(self, *args, **kwargs)
              config_path = bound.arguments.get("config_path")
              if config_path:
                  root = Path("model").resolve()
                  config = json.loads(Path(config_path).read_text(encoding="utf-8"))
                  paths = {
                      "d_vector_file": "speakers.pth",
                      "speakers_file": "speakers.pth",
                      "speaker_encoder_model_path": "model_se.pth",
                      "speaker_encoder_config_path": "config_se.json",
                  }
                  for name, filename in paths.items():
                      target = root / filename
                      assert target.is_file(), target
                      config[name] = str(target)
                      config.setdefault("model_args", {})[name] = str(target)
                  config["output_path"] = str(root)
                  config["datasets"] = []
                  runtime = root / "_mss_runtime_config.json"
                  runtime.write_text(json.dumps(config, ensure_ascii=False), encoding="utf-8")
                  bound.arguments["config_path"] = str(runtime)
                  print("Resolved embedding:", config["model_args"]["d_vector_file"], flush=True)
              return original_init(*bound.args, **bound.kwargs)
          TTS.__init__ = patched_init

          original_load = managers.load_file
          def checked_load(path, *args, **kwargs):
              print("Coqui embedding loader path:", repr(path), flush=True)
              # Coqui expects an individual .pth/.json file, not a stale training path.
              if not str(path).endswith((".pth", ".json")):
                  target = Path("model/speakers.pth").resolve()
                  if not target.is_file():
                      raise FileNotFoundError(target)
                  path = str(target)
              return original_load(path, *args, **kwargs)
          managers.load_file = checked_load

          helper = Path("model/hf_infer_pashto_ghag_yourtts.py").resolve()
          sys.path.insert(0, str(helper.parent))
          sys.argv[0] = str(helper)
          runpy.run_path(str(helper), run_name="__main__")
          PY
      - name: Generate Pashto lecturer example
        shell: bash
        run: |
          mkdir -p out
          sentences=(
            'السلام علیکم ګرانو زده کوونکو! زموږ د فلاتر د زده کړې لړۍ ته ښه راغلاست.'
            'نن به په عملي ډول زده کړو چې فلاتر څه شی دی او څنګه کولای شو د موبایل لپاره یوه ساده اپلېکېشن جوړه کړو.'
            'فلاتر موږ ته دا اسانتیا راکوي چې د یوه کوډ په وسیله د بېلابېلو وسیلو لپاره اپلېکېشن جوړ کړو.'
            'لومړی به یوه نوې پروژه جوړه کړو. بیا به د هغې جوړښت او د کوډ هره برخه په ګډه وڅېړو.'
            'که تاسې له پروګرامینګ سره تازه بلد شوي یاست، اندېښنه مه کوئ. هر مثال به په ساده ژبه او ګام په ګام تشریح کړو.'
          )
          for i in "${!sentences[@]}"; do
            python ghag_infer.py --model-dir "$PWD/model" --text "${sentences[$i]}" --speaker-id speaker_01_nasim_bahar --output-wav "out/part-$i.wav"
            ffmpeg -v error -y -i "out/part-$i.wav" -ar 22050 -ac 1 -c:a pcm_s16le "out/segment-$i.wav"
            printf "file 'segment-%s.wav'\n" "$i" >> out/concat.txt
          done
          ffmpeg -v error -y -f concat -safe 0 -i out/concat.txt -af 'highpass=f=70,loudnorm=I=-16:TP=-1.5:LRA=11' -ar 48000 -c:a libmp3lame -b:a 192k out/pashto-lecturer.mp3
          ffprobe -v error -show_format -show_streams out/pashto-lecturer.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: pashto-ghag-lecturer
          path: out/pashto-lecturer.mp3
          if-no-files-found: error
          retention-days: 7
