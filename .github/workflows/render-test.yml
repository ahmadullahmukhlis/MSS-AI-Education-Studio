name: Render Flutter lesson test
on:
  workflow_dispatch:
  push:
    paths:
      - render_test.py
      - .github/workflows/render-test.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python3 -m pip install pillow
      - name: Render and verify 10-20 minute lesson
        run: python3 render_test.py
      - name: Inspect audio and video
        run: ffprobe -v error -show_streams -show_format out/flutter-lesson-01.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-lesson-01
          path: out/flutter-lesson-01.mp4
          retention-days: 7
